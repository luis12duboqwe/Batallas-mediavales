events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Caddy is the only public edge and overwrites X-Forwarded-For. Use that
    # sanitized client address for rate limiting instead of Caddy's container
    # address; direct/internal callers without the header fall back safely.
    map $http_x_forwarded_for $effective_client_ip {
        "" $remote_addr;
        default $http_x_forwarded_for;
    }

    limit_req_zone $effective_client_ip zone=api_limit:10m rate=10r/s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;
        # TLS terminates at Caddy: never redirect a preserved-method POST
        # to an absolute http:// URL via Nginx's internal listener.
        absolute_redirect off;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /_edge_maintenance_check {
            internal;
            root /etc/nginx/edge-maintenance;
            disable_symlinks on;
            # A directory-only signal rejects FIFOs, sockets and regular
            # files before any content handler can open or block on them.
            try_files /open/ @edge_maintenance_denied;
            # Static empty GIF (200) only AFTER try_files confirms directory.
            empty_gif;
        }

        location @edge_maintenance_denied {
            return 403;
        }

        location @edge_maintenance_error {
            add_header Retry-After 60 always;
            add_header Cache-Control no-store always;
            return 503;
        }

        location = /api {
            auth_request /_edge_maintenance_check;
            error_page 403 = @edge_maintenance_error;
            error_page 418 =308 @edge_api_redirect;
            root /etc/nginx/edge-maintenance;
            try_files /_g5_api_redirect =418;
        }

        location @edge_api_redirect {
            return 308 /api/$is_args$args;
        }

        # Authenticate the maintenance marker before applying per-client limits.
        # limit_req in this location runs in Nginx pre-access, *before*
        # auth_request, so a closed gate could incorrectly return 429.
        location /api/ {
            auth_request /_edge_maintenance_check;
            error_page 403 = @edge_maintenance_error;
            root /etc/nginx/edge-maintenance;
            try_files /_g5_never_served @edge_api_upstream;
        }

        location @edge_api_upstream {
            # This internal redirect is reached only after the gate succeeded.
            limit_req_status 429;
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $effective_client_ip;
            proxy_set_header X-Forwarded-For $effective_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /socket.io {
            auth_request /_edge_maintenance_check;
            error_page 403 = @edge_maintenance_error;
            error_page 418 =308 @edge_socket_redirect;
            root /etc/nginx/edge-maintenance;
            try_files /_g5_socket_redirect =418;
        }

        location @edge_socket_redirect {
            return 308 /socket.io/$is_args$args;
        }

        location /socket.io/ {
            auth_request /_edge_maintenance_check;
            error_page 403 = @edge_maintenance_error;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $effective_client_ip;
            proxy_set_header X-Forwarded-For $effective_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $effective_client_ip;
            proxy_set_header X-Forwarded-For $effective_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
