name: G1 npm audit fix

on:
  push:
    branches:
      - security/G1-auth-e2e
    paths:
      - .github/workflows/g1-npm-audit-fix.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/G1-auth-e2e

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json

      - name: Repair lockfile without major upgrades
        working-directory: batalla_medieval_frontend
        run: npm audit fix --package-lock-only

      - name: Verify clean install and high-severity audit
        working-directory: batalla_medieval_frontend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- batalla_medieval_frontend/package-lock.json; then
            echo "Lockfile already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batalla_medieval_frontend/package-lock.json
          git commit -m "fix(G1): refresh frontend transitive dependencies"
          git push origin HEAD:security/G1-auth-e2e
