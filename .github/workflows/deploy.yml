name: Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target protected environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/batalla-medieval-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/batalla-medieval-frontend
  DEPLOY_ENV: ${{ inputs.environment }}
  DOCKER_BUILDKIT: 1

jobs:
  deploy:
    name: Deploy immutable release
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Refuse production deploys outside main
        if: ${{ inputs.environment == 'production' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Production deployments must be dispatched from main" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      - name: Build and push immutable backend image
        run: |
          docker build -t "$BACKEND_IMAGE:${{ github.sha }}" -f batalla_medieval_backend/Dockerfile batalla_medieval_backend
          docker push "$BACKEND_IMAGE:${{ github.sha }}"

      - name: Build and push immutable frontend image
        run: |
          docker build -t "$FRONTEND_IMAGE:${{ github.sha }}" -f batalla_medieval_frontend/Dockerfile batalla_medieval_frontend
          docker push "$FRONTEND_IMAGE:${{ github.sha }}"

      - name: Validate deployment bundle syntax
        run: |
          python3 -m compileall -q ops
          for script in ops/*.sh; do bash -n "$script"; done

      - name: Create remote application directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.REMOTE_APP_DIR }}"
            chmod 700 "${{ secrets.REMOTE_APP_DIR }}"

      - name: Upload versioned deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.deploy.yml,nginx.conf,ops"
          target: ${{ secrets.REMOTE_APP_DIR }}
          overwrite: true

      - name: Deploy with preflight, backup and automatic rollback
        uses: appleboy/ssh-action@v0.1.10
        env:
          BASE_ENV_B64: ${{ secrets.ENV_FILE_BASE64 }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || github.token }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BASE_ENV_B64,REGISTRY_USERNAME,REGISTRY_PASSWORD
          script: |
            set -euo pipefail
            umask 077
            cd "${{ secrets.REMOTE_APP_DIR }}"
            test -n "$BASE_ENV_B64"
            printf '%s' "$BASE_ENV_B64" | base64 -d > .env.base
            printf '%s' "$REGISTRY_PASSWORD" | docker login "${{ env.REGISTRY }}" -u "$REGISTRY_USERNAME" --password-stdin
            bash ops/deploy_remote.sh \
              .env.base \
              "${{ github.sha }}" \
              "${{ env.BACKEND_IMAGE }}" \
              "${{ env.FRONTEND_IMAGE }}"
            docker image prune -f
