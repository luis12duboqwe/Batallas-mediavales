name: UI Capture

on:
  push:
    branches:
      - chore/ui-captures-2026-08-25

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ui-captures-2026-08-25

      - name: Package screenshots
        uses: actions/upload-artifact@v4
        with:
          name: batallas-medievales-capturas
          path: captures/*.jpg
          if-no-files-found: error
          retention-days: 7
