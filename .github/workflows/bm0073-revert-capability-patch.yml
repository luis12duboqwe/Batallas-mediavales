name: BM-0073 revert capability patch

on:
  push:
    branches:
      - feature/BM-0073-admin-support-moderation
    paths:
      - .github/workflows/bm0073-revert-capability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/BM-0073-admin-support-moderation
      - name: Apply exact capability patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "batalla_medieval_backend/app/routers/admin.py",
              '''    current_admin: models.User = Depends(\n        admin_permissions.require_capability("admin.revert")\n    ),''',
              '''    current_admin: models.User = Depends(\n        admin_permissions.require_capability("audit.read")\n    ),''',
          )

          replace_once(
              "batalla_medieval_backend/app/services/admin.py",
              '''    before = _load_state(original.before_state)\n    after = _load_state(original.after_state)\n\n    if original.action == "update_city_resources":''',
              '''    required_capability = {\n        "update_city_resources": "game.correct",\n        "teleport_city": "game.correct",\n        "set_building_level": "game.correct",\n        "set_troop_amounts": "game.correct",\n        "set_user_freeze": "account.freeze",\n        "moderate_chat_message": "content.moderate",\n        "moderate_forum_post": "content.moderate",\n    }.get(original.action)\n    if required_capability is None:\n        raise HTTPException(status_code=409, detail="Reversal handler is not available for this action")\n    if not admin_permissions.has_capability(admin_user, required_capability):\n        raise HTTPException(\n            status_code=403,\n            detail=f"Administrative capability required: {required_capability}",\n        )\n\n    before = _load_state(original.before_state)\n    after = _load_state(original.after_state)\n\n    if original.action == "update_city_resources":''',
          )
          PY
          python -m compileall -q batalla_medieval_backend/app
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batalla_medieval_backend/app/routers/admin.py batalla_medieval_backend/app/services/admin.py
          git diff --cached --check
          git commit -m "fix(BM-0073): require equivalent capability for reversal"
          git push origin HEAD:feature/BM-0073-admin-support-moderation
