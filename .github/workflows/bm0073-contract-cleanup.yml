name: BM-0073 contract cleanup

on:
  push:
    branches:
      - feature/BM-0073-admin-support-moderation
    paths:
      - .github/workflows/bm0073-contract-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/BM-0073-admin-support-moderation
      - name: Apply focused contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}: {old!r}')
              p.write_text(text.replace(old, new, count))

          # Frontend: keep state setter and action function distinct.
          replace(
              'batalla_medieval_frontend/src/pages/AdminPanel.jsx',
              '  const setBuildingLevel = () => {',
              '  const applyBuildingLevel = () => {',
          )
          replace(
              'batalla_medieval_frontend/src/pages/AdminPanel.jsx',
              'onClick={setBuildingLevel}>Fijar nivel</button>',
              'onClick={applyBuildingLevel}>Fijar nivel</button>',
          )

          # The destructive admin DELETE endpoints were intentionally removed
          # from the v1.0 public contract by BM-0073.
          p = Path('tests/test_api_contract.py')
          text = p.read_text()
          for route in [
              '    ("DELETE", "/admin/user/{user_id}"),\n',
              '    ("DELETE", "/admin/city/{city_id}"),\n',
          ]:
              if text.count(route) != 1:
                  raise SystemExit(f'test_api_contract.py: missing legacy route {route!r}')
              text = text.replace(route, '', 1)
          p.write_text(text)

          replace(
              'tests/test_bm0073_admin_ops.py',
              '    assert delete_user.status_code == 405, delete_user.text\n    assert delete_city.status_code == 405, delete_city.text',
              '    assert delete_user.status_code == 404, delete_user.text\n    assert delete_city.status_code == 404, delete_city.text',
          )

          replace(
              'tests/test_g3_social_moderation.py',
              '        json={"is_frozen": False},',
              '        json={"is_frozen": False, "reason": "manual moderation test complete"},',
          )
          PY
          git diff --check
      - name: Commit focused fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batalla_medieval_frontend/src/pages/AdminPanel.jsx tests/test_api_contract.py tests/test_bm0073_admin_ops.py tests/test_g3_social_moderation.py
          git commit -m "fix(BM-0073): align admin UI and legacy contracts"
          git push origin HEAD:feature/BM-0073-admin-support-moderation
