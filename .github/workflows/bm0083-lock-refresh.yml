# Temporary self-removing action: regenerates only the lockfile to clear audit
# advisories. The workflow removes itself from the resulting commit.
name: BM0083 one-time lockfile refresh
on:
  push:
    branches:
      - feature/BM-0083-localizacion-final
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message == 'chore(BM-0083): run one-time lockfile refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh frontend lockfile without installing scripts
        run: |
          set -euo pipefail
          cd batalla_medieval_frontend
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --package-lock-only --audit-level=high
          cd ..
          git diff --exit-code -- batalla_medieval_frontend/package.json
          git rm .github/workflows/bm0083-lock-refresh.yml
          git add batalla_medieval_frontend/package-lock.json
          git diff --cached --quiet && { echo 'Lockfile was not refreshed'; exit 1; }
          git -c user.name='Batallas CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(BM-0083): refresh audited frontend lockfile'
          git push origin HEAD:refs/heads/feature/BM-0083-localizacion-final
