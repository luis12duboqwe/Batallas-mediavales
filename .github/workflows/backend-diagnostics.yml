name: Backend diagnostics

on:
  push:
    branches:
      - security/G1-auth-e2e
    paths:
      - .github/workflows/backend-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/G1-auth-e2e

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt

      - name: Capture pytest diagnostics
        run: |
          set +e
          PYTHONPATH=batalla_medieval_backend pytest -q --tb=short > backend-diagnostics.txt 2>&1
          status=$?
          echo "pytest_exit_code=$status" >> backend-diagnostics.txt
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-diagnostics.txt
          git commit -m "chore(G1): capture backend diagnostics"
          git push origin HEAD:security/G1-auth-e2e
