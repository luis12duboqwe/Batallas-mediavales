name: Staging Soak

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak duration"
        required: true
        default: "15m"
        type: choice
        options:
          - "15m"
          - "30m"
          - "60m"

permissions:
  contents: read

jobs:
  soak:
    name: Staging sustained read load
    if: ${{ vars.STAGING_BASE_URL != '' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      REQUESTED_DURATION: ${{ inputs.duration || '15m' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve bounded duration
        id: duration
        run: |
          case "$REQUESTED_DURATION" in
            15m) seconds=900 ;;
            30m) seconds=1800 ;;
            60m) seconds=3600 ;;
            *) echo "Unsupported duration: $REQUESTED_DURATION" >&2; exit 2 ;;
          esac
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Run sustained staging load
        run: >-
          python3 ops/load_smoke.py
          --base-url "$STAGING_BASE_URL"
          --duration-seconds "${{ steps.duration.outputs.seconds }}"
          --concurrency 8
          --max-p95-ms 750
          --max-error-rate 0.005

      - name: Smoke after sustained load
        run: >-
          python3 ops/smoke_http.py
          --base-url "$STAGING_BASE_URL"
          --requests 30
          --max-p95-ms 750

      - name: Notify optional alert webhook
        if: ${{ failure() }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$ALERT_WEBHOOK_URL" ]]; then
            echo "No external alert webhook configured; workflow failure is the alert signal."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              "text": f"Batalla Medieval staging soak failed: {os.environ['RUN_URL']}"
          }).encode()
          request = urllib.request.Request(
              os.environ["ALERT_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              if not 200 <= response.status < 300:
                  raise SystemExit(f"alert webhook returned HTTP {response.status}")
          PY
