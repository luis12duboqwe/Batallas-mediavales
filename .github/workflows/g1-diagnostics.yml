name: G1 diagnostics

on:
  push:
    branches:
      - security/G1-auth-e2e
    paths:
      - .github/workflows/g1-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/G1-auth-e2e

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt

      - name: Capture backend tests
        run: |
          set +e
          PYTHONPATH=batalla_medieval_backend pytest -q --tb=short > g1-backend-diagnostics.txt 2>&1
          echo "pytest_exit_code=$?" >> g1-backend-diagnostics.txt
          exit 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: batalla_medieval_frontend
        run: npm ci

      - name: Capture frontend lint and build
        working-directory: batalla_medieval_frontend
        run: |
          set +e
          npm run lint > ../g1-frontend-diagnostics.txt 2>&1
          echo "lint_exit_code=$?" >> ../g1-frontend-diagnostics.txt
          npm run build >> ../g1-frontend-diagnostics.txt 2>&1
          echo "build_exit_code=$?" >> ../g1-frontend-diagnostics.txt
          exit 0

      - name: Capture frontend audit
        working-directory: batalla_medieval_frontend
        run: |
          set +e
          npm audit --audit-level=high > ../g1-audit-diagnostics.txt 2>&1
          echo "audit_exit_code=$?" >> ../g1-audit-diagnostics.txt
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add g1-backend-diagnostics.txt g1-frontend-diagnostics.txt g1-audit-diagnostics.txt
          git commit -m "chore(G1): capture final diagnostics"
          git push origin HEAD:security/G1-auth-e2e
