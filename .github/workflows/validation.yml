name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batalla_medieval_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt
      - name: Install Nginx for mandatory G5 edge checks
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y nginx
          fi
      - name: Verify G5 edge maintenance with real Nginx (no skips)
        env:
          CI: "true"
        run: pytest -q -o addopts= tests/test_g5_edge_maintenance.py
      - name: Compile backend
        run: python -m compileall -q batalla_medieval_backend/app tests scripts ops
      - name: Validate migrations and canonical seed
        env:
          DATABASE_URL: sqlite:////tmp/batalla-medieval-migrations.db
          PYTHONPATH: batalla_medieval_backend
        run: |
          alembic -c batalla_medieval_backend/alembic.ini upgrade head
          python -m app.seed
          python -m app.seed
          alembic -c batalla_medieval_backend/alembic.ini downgrade base
      - name: Prepare PostgreSQL 15 image for isolated BM-0093 reproduction
        run: |
          docker info >/dev/null
          docker pull postgres:15-alpine
          docker image inspect postgres:15-alpine >/dev/null
      - name: Run backend tests
        run: pytest

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: batalla
          POSTGRES_PASSWORD: batalla-test
          POSTGRES_DB: batalla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batalla -d batalla_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://batalla:batalla-test@127.0.0.1:5432/batalla_test
      SECRET_KEY: test-only-secret-key-for-concurrency-validation
      CORS_ORIGINS: http://localhost:5173
      PYTHONPATH: batalla_medieval_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batalla_medieval_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt
      - name: Validate migrations in PostgreSQL (upgrade and rollback)
        run: |
          alembic -c batalla_medieval_backend/alembic.ini upgrade head
          alembic -c batalla_medieval_backend/alembic.ini downgrade base
      - name: Run concurrency tests
        run: >-
          pytest -q
          tests/test_economic_concurrency.py
          tests/test_world_onboarding_concurrency.py
          tests/test_building_completion_concurrency.py
          tests/test_unit_concurrency.py
          tests/test_movement_concurrency.py
          tests/test_market_concurrency.py
          tests/test_expansion_concurrency.py
          tests/test_pve_concurrency.py
          tests/test_hero_concurrency.py
          tests/test_g3_24h_simulation.py
          tests/test_tutorial_concurrency.py
          tests/test_community_concurrency.py
          tests/test_honor_medal_concurrency.py
          tests/test_world_lifecycle_concurrency.py
          tests/test_bm0073_admin_concurrency.py
          tests/test_bm0074_anticheat_concurrency.py
          tests/test_bm0090_privacy_concurrency.py
          tests/test_parallel_wonder_postgres.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batalla_medieval_frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate visual asset policy
        run: npm run lint:visual-assets
      - name: Validate accessible interaction policy
        run: npm run lint:accessible-interactions
      - name: Validate sound lifecycle
        run: npm run test:sound
      - name: Validate session recovery contract
        run: npm run test:resilience
      - name: Validate list response contracts
        run: npm run test:states
      - name: Validate selective city store subscriptions
        run: npm run test:store-subscriptions
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/batalla-medieval-g2-e2e.db
      SECRET_KEY: test-only-secret-key-for-browser-e2e-validation
      CORS_ORIGINS: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      PYTHONPATH: batalla_medieval_backend
      VITE_API_URL: http://127.0.0.1:8000
      VITE_SOCKET_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batalla_medieval_backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json
      - name: Install frontend and pinned browser test tooling
        working-directory: batalla_medieval_frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare E2E database
        run: |
          alembic -c batalla_medieval_backend/alembic.ini upgrade head
          python -m app.seed
          python scripts/prepare_g2_e2e.py
          python scripts/prepare_g6_expansion_e2e.py
          python scripts/prepare_g7_research_e2e.py
          python scripts/prepare_g8_unit_upkeep_e2e.py
          python scripts/prepare_g9_combat_e2e.py
          python scripts/prepare_g10_espionage_e2e.py
          python scripts/prepare_g11_commerce_e2e.py
          python scripts/prepare_g12_pve_e2e.py
          python scripts/prepare_g13_hero_e2e.py
          python scripts/prepare_g14_community_e2e.py
          python scripts/prepare_g15_ranking_medals_e2e.py
          python scripts/prepare_g16_world_lifecycle_e2e.py
          python scripts/prepare_g17_admin_support_e2e.py
          python scripts/prepare_g18_anticheat_e2e.py
      - name: Start backend and frontend
        run: |
          python -m uvicorn app.main:socket_app --app-dir batalla_medieval_backend --host 127.0.0.1 --port 8000 >/tmp/bm-backend.log 2>&1 &
          echo $! >/tmp/bm-backend.pid
          (cd batalla_medieval_frontend && npm run build && npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/bm-frontend.log 2>&1) &
          echo $! >/tmp/bm-frontend.pid
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:4173/login
      - name: Run accepted browser journeys
        working-directory: batalla_medieval_frontend
        run: |
          node e2e/g2-alpha.mjs
          node e2e/g4-ux.mjs
          node e2e/g6-expansion.mjs
          node e2e/g7-research.mjs
          node e2e/g8-unit-upkeep.mjs
          node e2e/g9-combat.mjs
          node e2e/g10-espionage.mjs
          node e2e/g11-commerce.mjs
          node e2e/g12-pve.mjs
          node e2e/g13-hero.mjs
          node e2e/g14-community.mjs
          node e2e/g15-ranking-medals.mjs
          node e2e/g16-world-lifecycle.mjs
          node e2e/g17-admin-support.mjs
          node e2e/g18-anticheat.mjs
          node e2e/g19-tutorial-help.mjs
          node e2e/g20-visual-assets.mjs
      - name: Show service logs
        if: always()
        run: |
          echo '--- backend ---'
          cat /tmp/bm-backend.log || true
          echo '--- frontend ---'
          cat /tmp/bm-frontend.log || true

  accessibility-e2e:
    name: Accessibility and media E2E
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/batalla-medieval-g21-e2e.db
      SECRET_KEY: test-only-secret-key-for-accessibility-e2e-validation
      CORS_ORIGINS: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      PYTHONPATH: batalla_medieval_backend
      VITE_API_URL: http://127.0.0.1:8000
      VITE_SOCKET_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batalla_medieval_backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json
      - name: Install frontend and pinned browser test tooling
        working-directory: batalla_medieval_frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare G21/G22 database
        run: |
          alembic -c batalla_medieval_backend/alembic.ini upgrade head
          python -m app.seed
          python scripts/prepare_g2_e2e.py
          python scripts/prepare_g9_combat_e2e.py
          python scripts/prepare_g14_community_e2e.py
      - name: Start backend and frontend
        run: |
          python -m uvicorn app.main:socket_app --app-dir batalla_medieval_backend --host 127.0.0.1 --port 8000 >/tmp/bm-g21-backend.log 2>&1 &
          echo $! >/tmp/bm-g21-backend.pid
          (cd batalla_medieval_frontend && npm run build && npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/bm-g21-frontend.log 2>&1) &
          echo $! >/tmp/bm-g21-frontend.pid
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:4173/login
      - name: Run G21 accessibility journey
        working-directory: batalla_medieval_frontend
        run: node e2e/g21-accessibility.mjs
      - name: Run G22 media/performance journey
        working-directory: batalla_medieval_frontend
        run: node e2e/g22-media-performance.mjs
      - name: Run G23 Spanish localization journey
        working-directory: batalla_medieval_frontend
        run: node e2e/g23-localization.mjs
      - name: Run G24 resilience journey
        working-directory: batalla_medieval_frontend
        run: node e2e/g24-resilience.mjs
      - name: Run G25 loading/empty/error journey
        working-directory: batalla_medieval_frontend
        run: node e2e/g25-states.mjs
      - name: Run G26 mobile map performance budgets
        working-directory: batalla_medieval_frontend
        run: node e2e/g26-map-performance.mjs
      - name: Run G27 adventure deadline transition
        working-directory: batalla_medieval_frontend
        run: node e2e/g27-adventure-deadline.mjs
      - name: Run G28 authenticated account export
        working-directory: batalla_medieval_frontend
        run: node e2e/g28-account-export.mjs
      - name: Run G29 manual privacy request intake
        working-directory: batalla_medieval_frontend
        run: node e2e/g29-privacy-requests.mjs
      - name: Show service logs
        if: always()
        run: |
          echo '--- backend ---'
          cat /tmp/bm-g21-backend.log || true
          echo '--- frontend ---'
          cat /tmp/bm-g21-frontend.log || true

  dependency-audit:
    name: Dependency and security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit bandit==1.9.4
          pip-audit -r batalla_medieval_backend/requirements.txt --progress-spinner=off
      - name: Static security analysis
        run: bandit -q -r batalla_medieval_backend/app -lll -iii
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: batalla_medieval_frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: batalla_medieval_frontend
        run: npm audit --audit-level=high

  g5-operations:
    name: G5 operations recovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Rehearse real Nginx admission and pre-existing WebSocket disconnect
        env:
          CI: "true"
        run: python3 -m ops.ci_g5_edge_admission
      - name: Verify deployment, backup, restore and load probes
        run: bash ops/ci_verify.sh
      - name: Rehearse persistent PostgreSQL 15 G5 writer fence on isolated container
        env:
          CI: "true"
        run: python3 -m ops.ci_g5_pg15_fence
      - name: Observe dedicated PG15 privileged writer topology and adversaries
        env:
          CI: "true"
        run: python3 -m ops.ci_g5_privileged_inventory
      - name: Rehearse integrated G5 activation, SQL fence and PREPARED snapshot on isolated PG15
        env:
          CI: "true"
        run: python3 -m ops.ci_g5_cutover_prepare_drill
      - name: Rehearse combined real G5 edge, SQL, Docker and PREPARED recovery
        env:
          CI: "true"
        run: python3 -m ops.ci_g5_integrated_runtime

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs:
      - backend
      - postgres-concurrency
      - frontend
      - browser-e2e
      - accessibility-e2e
      - dependency-audit
      - g5-operations
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend image
        run: docker build --tag medievol-g5-backend:ci --file batalla_medieval_backend/Dockerfile batalla_medieval_backend
      - name: Rehearse shipped Alembic and seed with fenced application identity
        env:
          CI: "true"
        run: python3 -m ops.ci_g5_actual_migration
      - name: Rehearse full-schema PostgreSQL rollback and adversaries
        env:
          CI: "true"
        run: |
          docker tag medievol-g5-backend:ci "bm-g5-full-schema-head:$(git rev-parse HEAD)"
          python3 -m ops.ci_g5_full_schema_restore --scenario all
      - name: Build frontend image
        run: docker build --tag medievol-g5-frontend:ci --file batalla_medieval_frontend/Dockerfile batalla_medieval_frontend
      - name: Verify shipped frontend is readable to Nginx
        run: |
          container="$(docker run -d --network none medievol-g5-frontend:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          # A /health-only probe can pass even if a restrictive umask makes
          # the actual HTML unreadable to the unprivileged Nginx worker.
          docker exec --user nginx "$container" sh -c 'test -r /usr/share/nginx/html/index.html'
          ok=0
          for attempt in $(seq 1 20); do
            if docker exec "$container" sh -c 'wget -qO /dev/null http://127.0.0.1/health && wget -qO /dev/null http://127.0.0.1/'; then
              ok=1
              break
            fi
            sleep 0.5
          done
          if [ "$ok" != 1 ]; then
            docker logs "$container" >&2
            echo "Packaged frontend does not serve HTML correctly" >&2
            exit 1
          fi
          echo "Packaged frontend HTTP and asset-readability smoke passed"
      - name: Rehearse actual game reopen after durable commit
        timeout-minutes: 25
        env:
          CI: "true"
        run: |
          set -euo pipefail
          docker pull postgres:15-alpine
          docker pull nginx:1.28-alpine
          workspace="$(mktemp -d)"
          trap 'rmdir "$workspace" || true' EXIT
          failed=0
          for scenario in precommit midreopen lost-response health drift success; do
            python3 -m ops.ci_g5_actual_reopen "$scenario" "$workspace" || failed=1
          done
          test "$failed" -eq 0
