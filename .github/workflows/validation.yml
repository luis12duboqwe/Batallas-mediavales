name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batalla_medieval_backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q batalla_medieval_backend/app tests

      - name: Validate migrations and canonical seed
        env:
          DATABASE_URL: sqlite:////tmp/batalla-medieval-migrations.db
          PYTHONPATH: batalla_medieval_backend
        run: |
          alembic -c batalla_medieval_backend/alembic.ini upgrade head
          python -m app.seed
          python -m app.seed
          alembic -c batalla_medieval_backend/alembic.ini downgrade base

      - name: Run backend tests
        run: pytest

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: batalla
          POSTGRES_PASSWORD: batalla-test
          POSTGRES_DB: batalla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batalla -d batalla_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://batalla:batalla-test@127.0.0.1:5432/batalla_test
      SECRET_KEY: test-only-secret-key-for-concurrency-validation
      CORS_ORIGINS: http://localhost:5173
      PYTHONPATH: batalla_medieval_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batalla_medieval_backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt

      - name: Run concurrency tests
        run: >-
          pytest -q
          tests/test_economic_concurrency.py
          tests/test_world_onboarding_concurrency.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batalla_medieval_frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r batalla_medieval_backend/requirements.txt --progress-spinner=off

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: batalla_medieval_frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: batalla_medieval_frontend
        run: npm audit --audit-level=high

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs:
      - backend
      - postgres-concurrency
      - frontend
      - dependency-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        run: docker build --file batalla_medieval_backend/Dockerfile batalla_medieval_backend

      - name: Build frontend image
        run: docker build --file batalla_medieval_frontend/Dockerfile batalla_medieval_frontend
