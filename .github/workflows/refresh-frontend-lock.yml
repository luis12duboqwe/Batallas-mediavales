name: Refresh frontend lockfile

on:
  push:
    branches:
      - security/G1-auth-e2e
    paths:
      - batalla_medieval_frontend/package.json
      - .github/workflows/refresh-frontend-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/G1-auth-e2e

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json

      - name: Resolve audited dependency graph
        working-directory: batalla_medieval_frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- batalla_medieval_frontend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batalla_medieval_frontend/package-lock.json
          git commit -m "chore(G1): regenerate audited frontend lockfile"
          git push origin HEAD:security/G1-auth-e2e
