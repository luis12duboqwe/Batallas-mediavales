name: UI Captures

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    name: Capture game screens
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/batalla-medieval-ui-captures.db
      SECRET_KEY: test-only-secret-key-for-ui-captures
      CORS_ORIGINS: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      PYTHONPATH: batalla_medieval_backend
      VITE_API_URL: http://127.0.0.1:8000
      VITE_SOCKET_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: batalla_medieval_backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json

      - name: Install frontend and browser tooling
        working-directory: batalla_medieval_frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare screenshot fixtures
        run: |
          alembic -c batalla_medieval_backend/alembic.ini upgrade head
          python -m app.seed
          python scripts/prepare_g8_unit_upkeep_e2e.py
          python scripts/prepare_g9_combat_e2e.py
          python scripts/prepare_g11_commerce_e2e.py
          python scripts/prepare_g12_pve_e2e.py

      - name: Start backend and frontend
        run: |
          python -m uvicorn app.main:socket_app --app-dir batalla_medieval_backend --host 127.0.0.1 --port 8000 >/tmp/bm-backend.log 2>&1 &
          echo $! >/tmp/bm-backend.pid
          (cd batalla_medieval_frontend && npm run build && npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/bm-frontend.log 2>&1) &
          echo $! >/tmp/bm-frontend.pid
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:4173/login

      - name: Capture clean game screens
        working-directory: batalla_medieval_frontend
        env:
          UI_CAPTURE_DIR: ui-captures
        run: node e2e/capture-ui.mjs

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batallas-medievales-ui-captures
          path: batalla_medieval_frontend/ui-captures/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: |
          echo '--- backend ---'
          cat /tmp/bm-backend.log || true
          echo '--- frontend ---'
          cat /tmp/bm-frontend.log || true
