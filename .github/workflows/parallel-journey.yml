name: Independent player journeys

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: player-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-journeys:
    name: Isolated E2E player journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: batalla_medieval_backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r batalla_medieval_backend/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: batalla_medieval_frontend/package-lock.json
      - name: Install frontend and pinned Chromium
        working-directory: batalla_medieval_frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run all isolated player journeys
        run: bash scripts/run_parallel_journey_ci.sh
