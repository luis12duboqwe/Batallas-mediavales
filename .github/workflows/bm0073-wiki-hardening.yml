name: BM-0073 wiki hardening

on:
  push:
    branches:
      - feature/BM-0073-admin-support-moderation
    paths:
      - .github/workflows/bm0073-wiki-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/BM-0073-admin-support-moderation
      - name: Harden wiki admin mutations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('batalla_medieval_backend/app/routers/wiki.py')
          text = p.read_text()

          def once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'wiki.py: expected one match, got {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)

          once(
              'from ..routers.auth import get_current_user\nfrom ..services import balance, espionage, event as event_service\n',
              'from ..services import admin as admin_service\nfrom ..services import admin_permissions, balance, espionage, event as event_service\n',
          )
          once(
              '''\n\ndef require_admin(current_user: models.User = Depends(get_current_user)):\n    if not getattr(current_user, "is_admin", False):\n        raise HTTPException(status_code=403, detail="Admin privileges required")\n    return current_user\n''',
              '',
          )
          once(
              '''@router.post("/create", response_model=schemas.WikiArticleRead)\ndef create_article(\n    payload: schemas.WikiArticleCreate,\n    db: Session = Depends(get_db),\n    current_admin: models.User = Depends(require_admin),\n):\n    ensure_builtin_articles(db)\n    article = models.WikiArticle(**payload.model_dump())\n    db.add(article)\n    db.commit()\n    db.refresh(article)\n    return article\n''',
              '''@router.post("/create", response_model=schemas.WikiArticleRead)\ndef create_article(\n    payload: schemas.WikiArticleCreate,\n    db: Session = Depends(get_db),\n    current_admin: models.User = Depends(\n        admin_permissions.require_capability("admin.manage")\n    ),\n    reason: str = Depends(admin_permissions.require_reason),\n):\n    ensure_builtin_articles(db)\n    article = models.WikiArticle(**payload.model_dump())\n    db.add(article)\n    db.flush()\n    admin_service.log_action(\n        db,\n        current_admin.id,\n        "create_wiki_article",\n        {"title": article.title},\n        target_type="wiki_article",\n        target_id=article.id,\n        reason=reason,\n        before_state=None,\n        after_state={\n            "exists": True,\n            "title": article.title,\n            "category": article.category,\n            "content_markdown": article.content_markdown,\n        },\n        reversible=False,\n    )\n    db.commit()\n    db.refresh(article)\n    return article\n''',
          )
          once(
              '''@router.patch("/edit/{article_id}", response_model=schemas.WikiArticleRead)\ndef edit_article(\n    article_id: int,\n    payload: schemas.WikiArticleUpdate,\n    db: Session = Depends(get_db),\n    current_admin: models.User = Depends(require_admin),\n):\n    ensure_builtin_articles(db)\n    article = (\n        db.query(models.WikiArticle)\n        .filter(models.WikiArticle.id == article_id)\n        .first()\n    )\n    if not article:\n        raise HTTPException(status_code=404, detail="Article not found")\n\n    for field, value in payload.model_dump(exclude_unset=True).items():\n        setattr(article, field, value)\n    article.updated_at = utc_now()\n    db.add(article)\n    db.commit()\n    db.refresh(article)\n    return article\n''',
              '''@router.patch("/edit/{article_id}", response_model=schemas.WikiArticleRead)\ndef edit_article(\n    article_id: int,\n    payload: schemas.WikiArticleUpdate,\n    db: Session = Depends(get_db),\n    current_admin: models.User = Depends(\n        admin_permissions.require_capability("admin.manage")\n    ),\n    reason: str = Depends(admin_permissions.require_reason),\n):\n    ensure_builtin_articles(db)\n    article = (\n        db.query(models.WikiArticle)\n        .filter(models.WikiArticle.id == article_id)\n        .with_for_update()\n        .one_or_none()\n    )\n    if not article:\n        raise HTTPException(status_code=404, detail="Article not found")\n\n    before = {\n        "title": article.title,\n        "category": article.category,\n        "content_markdown": article.content_markdown,\n    }\n    for field, value in payload.model_dump(exclude_unset=True).items():\n        setattr(article, field, value)\n    article.updated_at = utc_now()\n    after = {\n        "title": article.title,\n        "category": article.category,\n        "content_markdown": article.content_markdown,\n    }\n    admin_service.log_action(\n        db,\n        current_admin.id,\n        "edit_wiki_article",\n        {"fields": sorted(payload.model_dump(exclude_unset=True))},\n        target_type="wiki_article",\n        target_id=article.id,\n        reason=reason,\n        before_state=before,\n        after_state=after,\n        reversible=False,\n    )\n    db.add(article)\n    db.commit()\n    db.refresh(article)\n    return article\n''',
          )
          p.write_text(text)
          PY
          python -m compileall -q batalla_medieval_backend/app/routers/wiki.py
          git diff --check
      - name: Commit wiki hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batalla_medieval_backend/app/routers/wiki.py
          git commit -m "feat(BM-0073): capability-gate and audit wiki administration"
          git push origin HEAD:feature/BM-0073-admin-support-moderation
