services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  migrate:
    build:
      context: ./batalla_medieval_backend
    image: ${BACKEND_IMAGE:-batalla-medieval-backend:local}
    command: alembic -c /app/alembic.ini upgrade head
    restart: "no"
    environment:
      DATABASE_URL: ${DB_URL:?Set DB_URL in .env}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - web

  backend:
    build:
      context: ./batalla_medieval_backend
    image: ${BACKEND_IMAGE:-batalla-medieval-backend:local}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DB_URL:?Set DB_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - web

  worker:
    build:
      context: ./batalla_medieval_backend
    image: ${BACKEND_IMAGE:-batalla-medieval-backend:local}
    command: python -m app.worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DB_URL:?Set DB_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - web

  frontend:
    build:
      context: ./batalla_medieval_frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: ${FRONTEND_IMAGE:-batalla-medieval-frontend:local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - web

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - web

volumes:
  postgres-data:

networks:
  web:
    driver: bridge
