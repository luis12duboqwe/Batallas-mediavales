services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [web]

  migrate:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    command: alembic -c /app/alembic.ini upgrade head
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV}
      DATABASE_URL: ${DB_URL:?Set DB_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      FROM_EMAIL: ${FROM_EMAIL:?Set FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    depends_on:
      database:
        condition: service_healthy
    networks: [web]

  seed:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    command: python -m app.seed
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV}
      DATABASE_URL: ${DB_URL:?Set DB_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      FROM_EMAIL: ${FROM_EMAIL:?Set FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [web]

  backend:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV}
      DATABASE_URL: ${DB_URL:?Set DB_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      FROM_EMAIL: ${FROM_EMAIL:?Set FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    networks: [web]

  worker:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    command: python -m app.worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV}
      DATABASE_URL: ${DB_URL:?Set DB_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      FROM_EMAIL: ${FROM_EMAIL:?Set FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    depends_on:
      seed:
        condition: service_completed_successfully
    networks: [web]

  frontend:
    image: ${FRONTEND_IMAGE:?Set immutable FRONTEND_IMAGE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 6
    networks: [web]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [web]

volumes:
  postgres-data:

networks:
  web:
    driver: bridge
